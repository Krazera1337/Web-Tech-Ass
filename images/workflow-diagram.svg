<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" role="img" aria-label="Diagram of the four-stage research workflow used to build this site">
  <rect x="0" y="0" width="460" height="140" fill="#F4F0E6"/>
  <g font-size="12" fill="#26322e" text-anchor="middle">
    <rect x="10" y="45" width="90" height="50" rx="8" fill="#A8BFA3" stroke="#2F5D50" stroke-width="2"/>
    <text x="55" y="75">Research</text>
    <rect x="130" y="45" width="90" height="50" rx="8" fill="#A8BFA3" stroke="#2F5D50" stroke-width="2"/>
    <text x="175" y="75">Verify</text>
    <rect x="250" y="45" width="90" height="50" rx="8" fill="#A8BFA3" stroke="#2F5D50" stroke-width="2"/>
    <text x="295" y="75">Write</text>
    <rect x="370" y="45" width="80" height="50" rx="8" fill="#A8BFA3" stroke="#2F5D50" stroke-width="2"/>
    <text x="410" y="75">Publish</text>
    <path d="M100 70 H130 M220 70 H250 M340 70 H370" stroke="#2F5D50" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2F5D50"/>
    </marker>
  </defs>
</svg>
